<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1976d2">

<title>Workers Attendance</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#eef2f5;
    color:#222;
}

body.dark{
    background:#121212;
    color:#eee;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:15px;
}

/* LOGIN */

.login-box,
.dashboard{
    display:none;
}

.login-box.active,
.dashboard.active{
    display:block;
}

.login-box{
    max-width:430px;
    margin:60px auto;
    padding:25px;
    background:white;
    border-radius:14px;
    box-shadow:0 4px 18px rgba(0,0,0,.15);
}

body.dark .login-box,
body.dark .card,
body.dark .worker-card,
body.dark .history-card{
    background:#1e1e1e;
    border-color:#444;
}

h1{
    text-align:center;
    margin:10px 0;
}

h2{
    margin-top:5px;
}

.subtitle{
    text-align:center;
    color:#777;
}

body.dark .subtitle{
    color:#bbb;
}

/* INPUT */

input{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:1px solid #bbb;
    border-radius:8px;
    font-size:16px;
    background:white;
    color:#222;
}

body.dark input{
    background:#292929;
    color:white;
    border-color:#555;
}

/* BUTTON */

button{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:0;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.login-btn,
.add-btn{
    background:#1976d2;
    color:white;
}

.present-btn{
    background:#2e7d32;
    color:white;
}

.absent-btn{
    background:#d32f2f;
    color:white;
}

.logout-btn{
    background:#555;
    color:white;
}

.reset-btn{
    background:#ff9800;
    color:white;
}

.history-btn{
    background:#673ab7;
    color:white;
}

.delete-btn{
    background:#b71c1c;
    color:white;
}

.backup-btn{
    background:#455a64;
    color:white;
}

/* MESSAGE */

.message{
    text-align:center;
    font-weight:bold;
    min-height:22px;
    margin:10px 0;
}

/* DATE */

.date-box{
    text-align:center;
    background:#e3f2fd;
    padding:10px;
    border-radius:8px;
    margin:10px 0;
    font-weight:bold;
}

body.dark .date-box{
    background:#263238;
}

/* SUMMARY */

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin:12px 0;
}

.summary-box{
    padding:14px 5px;
    border-radius:10px;
    text-align:center;
    color:white;
}

.summary-box.total{
    background:#455a64;
}

.summary-box.present{
    background:#2e7d32;
}

.summary-box.absent{
    background:#d32f2f;
}

.summary-number{
    font-size:25px;
    font-weight:bold;
}

.summary-title{
    font-size:14px;
    margin-top:4px;
}

/* CARD */

.card,
.worker-card,
.history-card{
    background:white;
    padding:15px;
    margin:12px 0;
    border-radius:10px;
    border:1px solid #ddd;
}

/* WORKER */

.worker-card{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.worker-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.worker-name{
    font-size:18px;
    font-weight:bold;
}

.worker-id{
    font-size:13px;
    color:#777;
}

.status{
    padding:6px 9px;
    border-radius:6px;
    font-size:13px;
    font-weight:bold;
}

.status.present{
    background:#c8e6c9;
    color:#1b5e20;
}

.status.absent{
    background:#ffcdd2;
    color:#b71c1c;
}

.status.none{
    background:#eceff1;
    color:#455a64;
}

.worker-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.worker-actions button{
    margin:0;
}

.worker-actions .delete-btn{
    grid-column:1 / -1;
}

/* HISTORY */

.history-section{
    display:none;
}

.history-section.active{
    display:block;
}

.history-date{
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.history-summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
}

.history-number{
    padding:9px 4px;
    text-align:center;
    border-radius:7px;
    color:white;
    font-weight:bold;
    font-size:14px;
}

.history-number.present{
    background:#2e7d32;
}

.history-number.absent{
    background:#d32f2f;
}

.history-number.marked{
    background:#607d8b;
}

.empty{
    text-align:center;
    padding:18px;
    color:#777;
}

.small{
    font-size:13px;
    color:#777;
    margin-top:4px;
}

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    background:#222;
    color:white;
    padding:11px 16px;
    border-radius:8px;
    display:none;
    z-index:9999;
    max-width:90%;
    text-align:center;
}

.toast.show{
    display:block;
}

@media(max-width:420px){

    .container{
        padding:10px;
    }

    .summary-number{
        font-size:22px;
    }

}

</style>

</head>

<body>

<div class="container">

<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginBox" class="login-box active">

    <h1>👷 Workers Attendance</h1>

    <p class="subtitle">
        Worker Attendance Management System
    </p>

    <input
        type="text"
        id="username"
        placeholder="Username">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button
        class="login-btn"
        onclick="login()">

        Login

    </button>

    <div
        id="loginMessage"
        class="message">
    </div>

    <p
        style="text-align:center;color:#777;font-size:13px;">

        Demo Login: admin / 1234

    </p>

</div>


<!-- =====================================================
     DASHBOARD
===================================================== -->

<div id="dashboard" class="dashboard">

    <h1>👷 Workers Attendance</h1>

    <div class="date-box">

        📅 <span id="currentDate"></span>

    </div>


    <!-- SUMMARY -->

    <div class="summary">

        <div class="summary-box total">

            <div
                class="summary-number"
                id="totalWorkers">

                0

            </div>

            <div class="summary-title">
                Total
            </div>

        </div>


        <div class="summary-box present">

            <div
                class="summary-number"
                id="presentWorkers">

                0

            </div>

            <div class="summary-title">
                Present
            </div>

        </div>


        <div class="summary-box absent">

            <div
                class="summary-number"
                id="absentWorkers">

                0

            </div>

            <div class="summary-title">
                Absent
            </div>

        </div>

    </div>


    <!-- ADD WORKER -->

    <div class="card">

        <h2>➕ Add Worker</h2>

        <input
            type="text"
            id="workerName"
            placeholder="Worker Name">

        <input
            type="text"
            id="workerId"
            placeholder="Worker ID">

        <button
            class="add-btn"
            onclick="addWorker()">

            Add Worker

        </button>

        <div
            id="workerMessage"
            class="message">
        </div>

    </div>


    <!-- WORKER LIST -->

    <div class="card">

        <h2>👷 Worker List</h2>

        <div id="workerList"></div>

    </div>


    <!-- HISTORY BUTTON -->

    <button
        class="history-btn"
        onclick="toggleHistory()">

        📋 Attendance History

    </button>


    <!-- HISTORY -->

    <div
        id="historySection"
        class="history-section">

        <div id="historyList"></div>

    </div>


    <!-- CONTROLS -->

    <div class="card">

        <h2>⚙️ Controls</h2>

        <button
            class="reset-btn"
            onclick="resetTodayAttendance()">

            🔄 Reset Today's Attendance

        </button>


        <button
            class="backup-btn"
            onclick="backupData()">

            💾 Backup Data

        </button>


        <button
            onclick="restoreData()">

            📥 Restore Backup

        </button>


        <button
            onclick="toggleDarkMode()">

            🌙 Dark Mode

        </button>


        <button
            class="logout-btn"
            onclick="logout()">

            🚪 Logout

        </button>

    </div>

</div>

</div>


<!-- RESTORE FILE -->

<input
    type="file"
    id="restoreFile"
    accept=".json"
    style="display:none">


<!-- TOAST -->

<div
    id="toast"
    class="toast">
</div>


<script>

/* =====================================================
   STORAGE
===================================================== */

const WORKERS_KEY =
    "workers_attendance_workers";

const HISTORY_KEY =
    "workers_attendance_history";

const DIRECTORY_KEY =
    "workers_attendance_directory";

const DARK_KEY =
    "workers_attendance_dark";


/* =====================================================
   DATA
===================================================== */

let workers = [];

let attendanceHistory = {};

let directory = {};

let historyVisible = false;


/* =====================================================
   SAFE READ
===================================================== */

function readData(key, fallback){

    try{

        const data =
            localStorage.getItem(key);

        if(!data){
            return fallback;
        }

        return JSON.parse(data);

    }catch(error){

        console.log(error);

        return fallback;

    }

}


/* =====================================================
   SAFE SAVE
===================================================== */

function saveData(key, value){

    try{

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

    }catch(error){

        console.log(error);

        showToast(
            "⚠️ Data save नहीं हो सका"
        );

    }

}


/* =====================================================
   DATE KEY
===================================================== */

function getDateKey(){

    const date =
        new Date();

    const year =
        date.getFullYear();

    const month =
        String(
            date.getMonth()+1
        ).padStart(2,"0");

    const day =
        String(
            date.getDate()
        ).padStart(2,"0");

    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* =====================================================
   DISPLAY DATE
===================================================== */

function updateDate(){

    const date =
        new Date();

    const options = {

        day:"2-digit",
        month:"long",
        year:"numeric"

    };

    document
        .getElementById("currentDate")
        .innerText =
            date.toLocaleDateString(
                "hi-IN",
                options
            );

}


/* =====================================================
   LOAD DATA
===================================================== */

function loadData(){

    workers =
        readData(
            WORKERS_KEY,
            null
        );


    if(!Array.isArray(workers)){

        workers = [

            {
                id:"W001",
                name:"Ramesh",
                attendance:"none"
            },

            {
                id:"W002",
                name:"Suresh",
                attendance:"none"
            },

            {
                id:"W003",
                name:"Amit",
                attendance:"none"
            }

        ];

    }


    attendanceHistory =
        readData(
            HISTORY_KEY,
            {}
        );


    if(
        !attendanceHistory ||
        typeof attendanceHistory !== "object" ||
        Array.isArray(attendanceHistory)
    ){

        attendanceHistory = {};

    }


    directory =
        readData(
            DIRECTORY_KEY,
            {}
        );


    if(
        !directory ||
        typeof directory !== "object" ||
        Array.isArray(directory)
    ){

        directory = {};

    }


    normalizeWorkers();

    loadTodayAttendance();

    saveAll();

}


/* =====================================================
   NORMALIZE WORKERS
===================================================== */

function normalizeWorkers(){

    const clean = [];

    workers.forEach(function(worker){

        if(!worker){
            return;
        }

        const id =
            String(
                worker.id || ""
            ).trim();

        const name =
            String(
                worker.name || ""
            ).trim();

        if(!id || !name){
            return;
        }

        let attendance =
            "none";

        if(
            worker.attendance === "present" ||
            worker.attendance === "absent"
        ){

            attendance =
                worker.attendance;

        }

        clean.push({

            id:id,

            name:name,

            attendance:attendance

        });


        directory[id] =
            name;

    });


    workers =
        clean;

}


/* =====================================================
   SAVE ALL
===================================================== */

function saveAll(){

    saveData(
        WORKERS_KEY,
        workers
    );

    saveData(
        HISTORY_KEY,
        attendanceHistory
    );

    saveData(
        DIRECTORY_KEY,
        directory
    );

}


/* =====================================================
   LOAD TODAY
===================================================== */

function loadTodayAttendance(){

    const today =
        getDateKey();

    const todayData =
        attendanceHistory[today] || {};


    workers.forEach(function(worker){

        if(
            todayData[worker.id] === "present" ||
            todayData[worker.id] === "absent"
        ){

            worker.attendance =
                todayData[worker.id];

        }else{

            worker.attendance =
                "none";

        }

    });

}


/* =====================================================
   LOGIN
===================================================== */

function login(){

    const username =
        document
            .getElementById("username")
            .value
            .trim();

    const password =
        document
            .getElementById("password")
            .value
            .trim();

    const message =
        document
            .getElementById("loginMessage");


    if(
        username === "admin" &&
        password === "1234"
    ){

        document
            .getElementById("loginBox")
            .classList
            .remove("active");


        document
            .getElementById("dashboard")
            .classList
            .add("active");


        message.innerText = "";

        loadTodayAttendance();

        updateDate();

        renderWorkers();

        renderHistory();

        showToast(
            "✅ Login सफल"
        );


    }else{

        message.style.color =
            "#d32f2f";

        message.innerText =
            "❌ गलत Username या Password";

    }

}


/* =====================================================
   LOGOUT
===================================================== */

function logout(){

    document
        .getElementById("dashboard")
        .classList
        .remove("active");


    document
        .getElementById("loginBox")
        .classList
        .add("active");


    document
        .getElementById("username")
        .value = "";


    document
        .getElementById("password")
        .value = "";


    document
        .getElementById("loginMessage")
        .innerText = "";

}


/* =====================================================
   ADD WORKER
===================================================== */

function addWorker(){

    const nameInput =
        document.getElementById(
            "workerName"
        );

    const idInput =
        document.getElementById(
            "workerId"
        );

    const message =
        document.getElementById(
            "workerMessage"
        );


    const name =
        nameInput.value.trim();

    const id =
        idInput.value.trim();


    if(!name || !id){

        message.style.color =
            "#d32f2f";

        message.innerText =
            "❌ Worker Name और Worker ID दोनों भरें";

        return;

    }


    const exists =
        workers.some(function(worker){

            return (
                worker.id.toLowerCase() ===
                id.toLowerCase()
            );

        });


    if(exists){

        message.style.color =
            "#d32f2f";

        message.innerText =
            "❌ यह Worker ID पहले से मौजूद है";

        return;

    }


    workers.push({

        id:id,

        name:name,

        attendance:"none"

    });


    directory[id] =
        name;


    saveAll();

    nameInput.value = "";

    idInput.value = "";


    message.style.color =
        "#2e7d32";

    message.innerText =
        "✅ Worker Add हो गया";


    renderWorkers();

    showToast(
        "✅ Worker Add हो गया"
    );

}


/* =====================================================
   ATTENDANCE
===================================================== */

function setAttendance(id,status){

    const worker =
        workers.find(function(item){

            return item.id === id;

        });


    if(!worker){
        return;
    }


    worker.attendance =
        status;


    const today =
        getDateKey();


    if(!attendanceHistory[today]){

        attendanceHistory[today] = {};

    }


    attendanceHistory[today][id] =
        status;


    saveAll();

    renderWorkers();

    renderHistory();


    if(status === "present"){

        showToast(
            "✅ Present दर्ज हो गया"
        );

    }else{

        showToast(
            "❌ Absent दर्ज हो गया"
        );

    }

}


/* =====================================================
   RENDER WORKERS
===================================================== */

function renderWorkers(){

    const list =
        document.getElementById(
            "workerList"
        );


    list.innerHTML = "";


    if(workers.length === 0){

        list.innerHTML =
            '<div class="empty">कोई active worker नहीं है</div>';

        updateSummary();

        return;

    }


    workers.forEach(function(worker){

        const card =
            document.createElement("div");

        card.className =
            "worker-card";


        const top =
            document.createElement("div");

        top.className =
            "worker-top";


        const info =
            document.createElement("div");


        const name =
            document.createElement("div");

        name.className =
            "worker-name";

        name.textContent =
            worker.name;


        const id =
            document.createElement("div");

        id.className =
            "worker-id";

        id.textContent =
            "ID: " + worker.id;


        info.appendChild(name);

        info.appendChild(id);


        const status =
            document.createElement("span");

        status.className =
            "status " +
            worker.attendance;


        if(worker.attendance === "present"){

            status.textContent =
                "Present";

        }else if(
            worker.attendance === "absent"
        ){

            status.textContent =
                "Absent";

        }else{

            status.textContent =
                "Not Marked";

        }


        top.appendChild(info);

        top.appendChild(status);


        const actions =
            document.createElement("div");

        actions.className =
            "worker-actions";


        const present =
            document.createElement("button");

        present.className =
            "present-btn";

        present.textContent =
            "✅ Present";

        present.onclick =
            function(){

                setAttendance(
                    worker.id,
                    "present"
                );

            };


        const absent =
            document.createElement("button");

        absent.className =
            "absent-btn";

        absent.textContent =
            "❌ Absent";

        absent.onclick =
            function(){

                setAttendance(
                    worker.id,
                    "absent"
                );

            };


        const deleteBtn =
            document.createElement("button");

        deleteBtn.className =
            "delete-btn";

        deleteBtn.textContent =
            "🗑️ Worker ने काम छोड़ दिया — Delete";

        deleteBtn.onclick =
            function(){

                deleteWorker(
                    worker.id
                );

            };


        actions.appendChild(present);

        actions.appendChild(absent);

        actions.appendChild(deleteBtn);


        card.appendChild(top);

        card.appendChild(actions);


        list.appendChild(card);

    });


    updateSummary();

}


/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(){

    const total =
        workers.length;


    const present =
        workers.filter(function(worker){

            return worker.attendance === "present";

        }).length;


    const absent =
        workers.filter(function(worker){

            return worker.attendance === "absent";

        }).length;


    document
        .getElementById("totalWorkers")
        .innerText = total;


    document
        .getElementById("presentWorkers")
        .innerText = present;


    document
        .getElementById("absentWorkers")
        .innerText = absent;

}


/* =====================================================
   DELETE WORKER
===================================================== */

function deleteWorker(id){

    const worker =
        workers.find(function(item){

            return item.id === id;

        });


    if(!worker){
        return;
    }


    const confirmDelete =
        confirm(
            worker.name +
            " (" +
            worker.id +
            ") को active list से हटाना है?\n\nपुरानी attendance history सुरक्षित रहेगी।"
        );


    if(!confirmDelete){
        return;
    }


    /*
       Worker active list से हटेगा।
       Directory और History से नहीं हटेगा।
    */


    workers =
        workers.filter(function(item){

            return item.id !== id;

        });


    directory[id] =
        worker.name;


    saveAll();

    renderWorkers();

    renderHistory();


    showToast(
        "🗑️ Worker हट गया, पुरानी history सुरक्षित है"
    );

}


/* =====================================================
   RESET TODAY
===================================================== */

function resetTodayAttendance(){

    const ok =
        confirm(
            "क्या आज की पूरी attendance reset करनी है?"
        );


    if(!ok){
        return;
    }


    const today =
        getDateKey();


    attendanceHistory[today] =
        {};


    workers.forEach(function(worker){

        worker.attendance =
            "none";

    });


    saveAll();

    renderWorkers();

    renderHistory();


    showToast(
        "🔄 आज की attendance reset हो गई"
    );

}


/* =====================================================
   HISTORY TOGGLE
===================================================== */

function toggleHistory(){

    historyVisible =
        !historyVisible;


    document
        .getElementById("historySection")
        .classList
        .toggle(
            "active",
            historyVisible
        );


    if(historyVisible){

        renderHistory();

    }

}


/* =====================================================
   HISTORY DATE
===================================================== */

function formatHistoryDate(key){

    const parts =
        key.split("-");


    if(parts.length !== 3){
        return key;
    }


    const date =
        new Date(
            Number(parts[0]),
            Number(parts[1])-1,
            Number(parts[2])
        );


    return date.toLocaleDateString(
        "hi-IN",
        {
            day:"2-digit",
            month:"long",
            year:"numeric"
        }
    );

}


/* =====================================================
   RENDER HISTORY
===================================================== */

function renderHistory(){

    const list =
        document.getElementById(
            "historyList"
        );


    list.innerHTML = "";


    const dates =
        Object.keys(
            attendanceHistory
        ).sort().reverse();


    if(dates.length === 0){

        list.innerHTML =
            '<div class="empty">अभी कोई attendance history नहीं है</div>';

        return;

    }


    dates.forEach(function(dateKey){

        const data =
            attendanceHistory[dateKey];


        if(
            !data ||
            typeof data !== "object"
        ){

            return;

        }


        const ids =
            Object.keys(data);


        let present = 0;

        let absent = 0;


        ids.forEach(function(id){

            if(data[id] === "present"){

                present++;

            }

            if(data[id] === "absent"){

                absent++;

            }

        });


        const marked =
            present + absent;


        if(marked === 0){

            return;

        }


        const card =
            document.createElement("div");

        card.className =
            "history-card";


        const title =
            document.createElement("div");

        title.className =
            "history-date";

        title.textContent =
            "📅 " +
            formatHistoryDate(
                dateKey
            );


        const summary =
            document.createElement("div");

        summary.className =
            "history-summary";


        const p =
            document.createElement("div");

        p.className =
            "history-number present";

        p.textContent =
            "Present: " + present;


        const a =
            document.createElement("div");

        a.className =
            "history-number absent";

        a.textContent =
            "Absent: " + absent;


        const m =
            document.createElement("div");

        m.className =
            "history-number marked";

        m.textContent =
            "Marked: " + marked;


        summary.appendChild(p);

        summary.appendChild(a);

        summary.appendChild(m);


        card.appendChild(title);

        card.appendChild(summary);


        ids.forEach(function(id){

            const row =
                document.createElement("div");

            row.className =
                "small";


            const name =
                directory[id] || id;


            const status =
                data[id] === "present"
                    ? "Present"
                    : "Absent";


            row.textContent =
                name +
                " (" +
                id +
                "): " +
                status;


            card.appendChild(row);

        });


        list.appendChild(card);

    });


    if(
        list.innerHTML.trim() === ""
    ){

        list.innerHTML =
            '<div class="empty">अभी कोई marked attendance history नहीं है</div>';

    }

}


/* =====================================================
   DARK MODE
===================================================== */

function applyDarkMode(){

    const dark =
        localStorage.getItem(
            DARK_KEY
        ) === "true";


    document.body.classList.toggle(
        "dark",
        dark
    );

}


function toggleDarkMode(){

    const dark =
        document.body.classList.toggle(
            "dark"
        );


    localStorage.setItem(
        DARK_KEY,
        String(dark)
    );


    showToast(
        dark
            ? "🌙 Dark Mode ON"
            : "☀️ Dark Mode OFF"
    );

}


/* =====================================================
   BACKUP
===================================================== */

function backupData(){

    const backup = {

        app:"Workers Attendance",

        version:1,

        createdAt:
            new Date().toISOString(),

        workers:
            workers,

        attendanceHistory:
            attendanceHistory,

        directory:
            directory

    };


    const blob =
        new Blob(
            [
                JSON.stringify(
                    backup,
                    null,
                    2
                )
            ],
            {
                type:"application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href =
        url;


    link.download =
        "workers-attendance-backup-" +
        getDateKey() +
        ".json";


    document.body.appendChild(link);

    link.click();

    link.remove();


    URL.revokeObjectURL(url);


    showToast(
        "💾 Backup तैयार हो गया"
    );

}


/* =====================================================
   RESTORE
===================================================== */

function restoreData(){

    document
        .getElementById("restoreFile")
        .click();

}


document
    .getElementById("restoreFile")
    .addEventListener(
        "change",
        function(event){

            const file =
                event.target.files[0];


            if(!file){
                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function(){

                    try{

                        const backup =
                            JSON.parse(
                                reader.result
                            );


                        if(
                            !backup ||
                            !Array.isArray(
                                backup.workers
                            ) ||
                            !backup.attendanceHistory
                        ){

                            throw new Error(
                                "Invalid backup"
                            );

                        }


                        workers =
                            backup.workers;


                        attendanceHistory =
                            backup.attendanceHistory;


                        directory =
                            backup.directory || {};


                        normalizeWorkers();

                        loadTodayAttendance();

                        saveAll();

                        renderWorkers();

                        renderHistory();


                        showToast(
                            "✅ Backup Restore हो गया"
                        );


                    }catch(error){

                        console.log(error);

                        alert(
                            "❌ Backup file सही नहीं है"
                        );

                    }


                    event.target.value = "";

                };


            reader.readAsText(file);

        }
    );


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(text){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.innerText =
        text;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}
