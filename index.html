<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Workers Attendance</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    margin:0;
    padding:15px;
    color:#222;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 3px 12px #ccc;
}

h1,h2{
    text-align:center;
}

.subtitle{
    text-align:center;
    color:#666;
}

/* BUTTONS */

button{
    width:100%;
    padding:13px;
    margin:6px 0;
    border:0;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.login-btn,
.add-btn{
    background:#1976d2;
    color:white;
}

.present-btn{
    background:#2e7d32;
    color:white;
}

.absent-btn{
    background:#d32f2f;
    color:white;
}

.logout-btn{
    background:#555;
    color:white;
}

.reset-btn{
    background:#ff9800;
    color:white;
}

.history-btn{
    background:#673ab7;
    color:white;
}

/* INPUT */

input{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:1px solid #bbb;
    border-radius:7px;
    font-size:16px;
}

/* SCREENS */

.login-box,
.dashboard{
    display:none;
}

.login-box.active,
.dashboard.active{
    display:block;
}

/* MESSAGE */

.message{
    text-align:center;
    font-weight:bold;
    margin:10px 0;
    min-height:20px;
}

/* CARDS */

.card,
.worker-card,
.history-card{
    background:#f8f9fa;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #ddd;
}

.worker-name{
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.worker-info{
    color:#666;
    font-size:14px;
}

/* SUMMARY */

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:15px 0;
}

.summary-box{
    padding:15px 5px;
    text-align:center;
    border-radius:10px;
    color:white;
}

.total{
    background:#1976d2;
}

.present{
    background:#2e7d32;
}

.absent{
    background:#d32f2f;
}

.summary-number{
    font-size:25px;
    font-weight:bold;
}

.summary-title{
    font-size:13px;
}

/* STATUS */

.status{
    padding:8px;
    border-radius:7px;
    text-align:center;
    margin:8px 0;
    font-weight:bold;
}

.status-present{
    background:#c8e6c9;
    color:#1b5e20;
}

.status-absent{
    background:#ffcdd2;
    color:#b71c1c;
}

.status-none{
    background:#eeeeee;
    color:#555;
}

/* DATE */

.date-box{
    text-align:center;
    font-weight:bold;
    margin:10px 0;
    color:#444;
}

/* HISTORY */

.history-section{
    margin-top:20px;
}

.history-date{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.history-summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
}

.history-number{
    padding:10px 5px;
    text-align:center;
    border-radius:7px;
    color:white;
    font-weight:bold;
}

.history-total{
    background:#1976d2;
}

.history-present{
    background:#2e7d32;
}

.history-absent{
    background:#d32f2f;
}

.history-workers{
    margin-top:10px;
}

.history-worker{
    padding:8px;
    margin:5px 0;
    background:white;
    border-radius:6px;
    border:1px solid #ddd;
}

.no-history{
    text-align:center;
    color:#777;
    padding:15px;
}

/* DARK MODE */

.dark{
    background:#222;
    color:white;
}

.dark .container{
    background:#333;
    color:white;
}

.dark .card,
.dark .worker-card,
.dark .history-card{
    background:#444;
    border-color:#555;
}

.dark input{
    background:#444;
    color:white;
    border-color:#777;
}

.dark .subtitle,
.dark .worker-info{
    color:#ccc;
}

.dark .history-worker{
    background:#555;
    border-color:#666;
}

/* RESPONSIVE */

@media(max-width:500px){

    body{
        padding:8px;
    }

    .container{
        padding:15px;
    }

    .summary{
        grid-template-columns:1fr 1fr 1fr;
    }

    .summary-box{
        padding:12px 3px;
    }

    .summary-number{
        font-size:21px;
    }

    .history-summary{
        grid-template-columns:1fr 1fr 1fr;
    }

}

</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div id="loginBox" class="login-box active">

    <h1>👷 Workers Attendance</h1>

    <p class="subtitle">
        Worker Attendance Management System
    </p>

    <input
        type="text"
        id="username"
        placeholder="Username">

    <input
        type="password"
        id="password"
