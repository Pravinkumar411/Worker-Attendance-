<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Workers Attendance</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f8;
    margin:0;
    padding:15px;
    color:#222;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 3px 12px #ccc;
}

h1,h2{
    text-align:center;
}

.subtitle{
    text-align:center;
    color:#666;
}

/* BUTTONS */

button{
    width:100%;
    padding:13px;
    margin:6px 0;
    border:0;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.login-btn,
.add-btn{
    background:#1976d2;
    color:white;
}

.present-btn{
    background:#2e7d32;
    color:white;
}

.absent-btn{
    background:#d32f2f;
    color:white;
}

.logout-btn{
    background:#555;
    color:white;
}

.reset-btn{
    background:#ff9800;
    color:white;
}

.history-btn{
    background:#673ab7;
    color:white;
}

/* INPUT */

input{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:1px solid #bbb;
    border-radius:7px;
    font-size:16px;
}

/* SCREENS */

.login-box,
.dashboard{
    display:none;
}

.login-box.active,
.dashboard.active{
    display:block;
}

/* MESSAGE */

.message{
    text-align:center;
    font-weight:bold;
    margin:10px 0;
    min-height:20px;
}

/* CARDS */

.card,
.worker-card,
.history-card{
    background:#f8f9fa;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #ddd;
}

.worker-name{
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.worker-info{
    color:#666;
    font-size:14px;
}

/* SUMMARY */

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin:15px 0;
}

.summary-box{
    padding:15px 5px;
    text-align:center;
    border-radius:10px;
    color:white;
}

.total{
    background:#1976d2;
}

.present{
    background:#2e7d32;
}

.absent{
    background:#d32f2f;
}

.summary-number{
    font-size:25px;
    font-weight:bold;
}

.summary-title{
    font-size:13px;
}

/* STATUS */

.status{
    padding:8px;
    border-radius:7px;
    text-align:center;
    margin:8px 0;
    font-weight:bold;
}

.status-present{
    background:#c8e6c9;
    color:#1b5e20;
}

.status-absent{
    background:#ffcdd2;
    color:#b71c1c;
}

.status-none{
    background:#eeeeee;
    color:#555;
}

/* DATE */

.date-box{
    text-align:center;
    font-weight:bold;
    margin:10px 0;
    color:#444;
}

/* HISTORY */

.history-section{
    margin-top:20px;
}

.history-date{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.history-summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
}

.history-number{
    padding:10px 5px;
    text-align:center;
    border-radius:7px;
    color:white;
    font-weight:bold;
}

.history-total{
    background:#1976d2;
}

.history-present{
    background:#2e7d32;
}

.history-absent{
    background:#d32f2f;
}

.history-workers{
    margin-top:10px;
}

.history-worker{
    padding:8px;
    margin:5px 0;
    background:white;
    border-radius:6px;
    border:1px solid #ddd;
}

.no-history{
    text-align:center;
    color:#777;
    padding:15px;
}

/* DARK MODE */

.dark{
    background:#222;
    color:white;
}

.dark .container{
    background:#333;
    color:white;
}

.dark .card,
.dark .worker-card,
.dark .history-card{
    background:#444;
    border-color:#555;
}

.dark input{
    background:#444;
    color:white;
    border-color:#777;
}

.dark .subtitle,
.dark .worker-info{
    color:#ccc;
}

.dark .history-worker{
    background:#555;
    border-color:#666;
}

/* RESPONSIVE */

@media(max-width:500px){

    body{
        padding:8px;
    }

    .container{
        padding:15px;
    }

    .summary{
        grid-template-columns:1fr 1fr 1fr;
    }

    .summary-box{
        padding:12px 3px;
    }

    .summary-number{
        font-size:21px;
    }

    .history-summary{
        grid-template-columns:1fr 1fr 1fr;
    }

}

</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div id="loginBox" class="login-box active">

    <h1>👷 Workers Attendance</h1>

    <p class="subtitle">
        Worker Attendance Management System
    </p>

    <input
        type="text"
        id="username"
        placeholder="Username">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button
        class="login-btn"
        onclick="login()">
        Login
    </button>

    <div id="loginMessage" class="message"></div>

    <p style="text-align:center;color:#777;font-size:13px;">
        Demo Login: admin / 1234
    </p>

</div>


<!-- DASHBOARD -->

<div id="dashboard" class="dashboard">

    <h1>👷 Workers Attendance</h1>

    <div class="date-box">
        📅 <span id="currentDate"></span>
    </div>


    <!-- SUMMARY -->

    <div class="summary">

        <div class="summary-box total">

            <div class="summary-number"
                 id="totalWorkers">
                0
            </div>

            <div class="summary-title">
                Total
            </div>

        </div>


        <div class="summary-box present">

            <div class="summary-number"
                 id="presentWorkers">
                0
            </div>

            <div class="summary-title">
                Present
            </div>

        </div>


        <div class="summary-box absent">

            <div class="summary-number"
                 id="absentWorkers">
                0
            </div>

            <div class="summary-title">
                Absent
            </div>

        </div>

    </div>


    <!-- ADD WORKER -->

    <div class="card">

        <h2>➕ Add Worker</h2>

        <input
            type="text"
            id="workerName"
            placeholder="Worker Name">

        <input
            type="text"
            id="workerId"
            placeholder="Worker ID">

        <button
            class="add-btn"
            onclick="addWorker()">
            Add Worker
        </button>

    </div>


    <!-- WORKER LIST -->

    <h2>👷 Worker List</h2>

    <div id="workerList"></div>


    <!-- HISTORY BUTTON -->

    <button
        class="history-btn"
        onclick="toggleHistory()">
        📋 Attendance History
    </button>


    <!-- HISTORY -->

    <div id="historySection"
         class="history-section"
         style="display:none;">

        <h2>📅 Attendance History</h2>

        <div id="historyList"></div>

    </div>


    <!-- CONTROLS -->

    <button
        class="reset-btn"
        onclick="resetAttendance()">
        🔄 Reset Today's Attendance
    </button>


    <button
        class="logout-btn"
        onclick="logout()">
        🚪 Logout
    </button>


    <button
        onclick="toggleDarkMode()">
        🌙 Dark Mode
    </button>

</div>

</div>


<script>

/* =========================
   DATA
========================= */

let workers = JSON.parse(
    localStorage.getItem("workers")
) || [

    {
        id:"W001",
        name:"Ramesh",
        attendance:"none"
    },

    {
        id:"W002",
        name:"Suresh",
        attendance:"none"
    },

    {
        id:"W003",
        name:"Amit",
        attendance:"none"
    }

];


/*
   History format:

   {
      "2026-09-09": {
          "W001":"present",
          "W002":"absent"
      }
   }
*/

let attendanceHistory = JSON.parse(
    localStorage.getItem("attendanceHistory")
) || {};


/* =========================
   DATE KEY
========================= */

function getDateKey(){

    const date = new Date();

    const year = date.getFullYear();

    const month =
        String(date.getMonth()+1).padStart(2,"0");

    const day =
        String(date.getDate()).padStart(2,"0");

    return year + "-" + month + "-" + day;

}


/* =========================
   DISPLAY DATE
========================= */

function updateDate(){

    const date = new Date();

    const options = {
        day:"2-digit",
        month:"long",
        year:"numeric"
    };

    document.getElementById("currentDate")
        .innerText =
        date.toLocaleDateString("hi-IN",options);

}


/* =========================
   LOAD TODAY ATTENDANCE
========================= */

function loadTodayAttendance(){

    const today = getDateKey();

    const todayData =
        attendanceHistory[today] || {};


    workers.forEach(worker => {

        if(todayData[worker.id]){

            worker.attendance =
                todayData[worker.id];

        }
        else{

            worker.attendance = "none";

        }

    });

}


/* =========================
   SAVE WORKERS
========================= */

function saveWorkers(){

    localStorage.setItem(
        "workers",
        JSON.stringify(workers)
    );

}


/* =========================
   SAVE HISTORY
========================= */

function saveHistory(){

    localStorage.setItem(
        "attendanceHistory",
        JSON.stringify(attendanceHistory)
    );

}


/* =========================
   LOGIN
========================= */

function login(){

    const username =
        document.getElementById("username")
        .value.trim();

    const password =
        document.getElementById("password")
        .value.trim();

    const message =
        document.getElementById("loginMessage");


    if(
        username === "admin" &&
        password === "1234"
    ){

        document.getElementById("loginBox")
            .classList.remove("active");

        document.getElementById("dashboard")
            .classList.add("active");

        message.innerText = "";

        loadTodayAttendance();
        updateDate();
        renderWorkers();

    }
    else{

        message.style.color = "#d32f2f";

        message.innerText =
            "❌ गलत Username या Password";

    }

}


/* =========================
   LOGOUT
========================= */

function logout(){

    document.getElementById("dashboard")
        .classList.remove("active");

    document.getElementById("loginBox")
        .classList.add("active");

    document.getElementById("username")
        .value = "";

    document.getElementById("password")
        .value = "";

}


/* =========================
   ADD WORKER
========================= */

function addWorker(){

    const name =
        document.getElementById("workerName")
        .value.trim();

    const id =
        document.getElementById("workerId")
        .value.trim();


    if(name === "" || id === ""){

        alert(
            "Worker Name और Worker ID डालें।"
        );

        return;

    }


    const alreadyExists =
        workers.some(
            worker => worker.id === id
        );


    if(alreadyExists){

        alert(
            "यह Worker ID पहले से मौजूद है।"
        );

        return;

    }


    workers.push({

        id:id,
        name:name,
        attendance:"none"

    });


    saveWorkers();


    document.getElementById("workerName")
        .value = "";

    document.getElementById("workerId")
        .value = "";


    renderWorkers();

}


/* =========================
   MARK ATTENDANCE
========================= */

function markAttendance(index,status){

    const worker = workers[index];

    const today = getDateKey();


    if(!attendanceHistory[today]){

        attendanceHistory[today] = {};

    }


    attendanceHistory[today][worker.id] =
        status;


    worker.attendance = status;


    saveHistory();
    saveWorkers();

    renderWorkers();

}


/* =========================
   RENDER WORKERS
========================= */

function renderWorkers(){

    const list =
        document.getElementById("workerList");

    list.innerHTML = "";


    workers.forEach((worker,index)=>{

        let statusHTML = "";


        if(worker.attendance === "present"){

            statusHTML = `
                <div class="status status-present">
                    ✅ Present
                </div>
            `;

        }
        else if(worker.attendance === "absent"){

            statusHTML = `
                <div class="status status-absent">
                    ❌ Absent
                </div>
            `;

        }
        else{

            statusHTML = `
                <div class="status status-none">
                    ⏳ Attendance Not Marked
                </div>
            `;

        }


        const card =
            document.createElement("div");

        card.className =
            "worker-card";


        card.innerHTML = `

            <div class="worker-name">
                👷 ${worker.name}
            </div>

            <div class="worker-info">
                Worker ID: ${worker.id}
            </div>

            ${statusHTML}

            <button
                class="present-btn"
                onclick="markAttendance(${index},'present')">
                ✅ Present
            </button>

            <button
                class="absent-btn"
                onclick="markAttendance(${index},'absent')">
                ❌ Absent
            </button>

        `;


        list.appendChild(card);

    });


    updateSummary();

}


/* =========================
   SUMMARY
========================= */

function updateSummary(){

    const total =
        workers.length;


    const present =
        workers.filter(
            worker =>
            worker.attendance === "present"
        ).length;


    const absent =
        workers.filter(
            worker =>
            worker.attendance === "absent"
        ).length;


    document.getElementById("totalWorkers")
        .innerText = total;


    document.getElementById("presentWorkers")
        .innerText = present;


    document.getElementById("absentWorkers")
        .innerText = absent;

}


/* =========================
   RESET TODAY
========================= */

function resetAttendance(){

    const confirmReset =
        confirm(
            "क्या आप आज की पूरी attendance reset करना चाहते हैं?"
        );


    if(!confirmReset){

        return;

    }


    const today = getDateKey();


    delete attendanceHistory[today];


    workers.forEach(worker => {

        worker.attendance = "none";

    });


    saveHistory();
    saveWorkers();

    renderWorkers();


    if(
        document.getElementById("historySection")
            .style.display !== "none"
    ){

        renderHistory();

    }

}


/* =========================
   HISTORY TOGGLE
========================= */

function toggleHistory(){

    const section =
        document.getElementById("historySection");


    if(section.style.display === "none"){

        section.style.display = "block";

        renderHistory();

    }
    else{

        section.style.display = "none";

    }

}


/* =========================
   FORMAT HISTORY DATE
========================= */

function formatHistoryDate(dateKey){

    const parts =
        dateKey.split("-");


    const date =
        new Date(
            Number(parts[0]),
            Number(parts[1])-1,
            Number(parts[2])
        );


    return date.toLocaleDateString(
        "hi-IN",
        {
            day:"2-digit",
            month:"long",
            year:"numeric"
        }
    );

}


/* =========================
   RENDER HISTORY
========================= */

function renderHistory(){

    const list =
        document.getElementById("historyList");

    list.innerHTML = "";


    const dates =
        Object.keys(attendanceHistory)
            .sort()
            .reverse();


    if(dates.length === 0){

        list.innerHTML = `
            <div class="history-card no-history">
                📭 अभी कोई Attendance History नहीं है।
            </div>
        `;

        return;

    }


    dates.forEach(dateKey => {

        const dayData =
            attendanceHistory[dateKey];


        let present = 0;
        let absent = 0;


        Object.values(dayData)
            .forEach(status => {

                if(status === "present"){
                    present++;
                }

                if(status === "absent"){
                    absent++;
                }

            });


        const total =
            workers.length;


        const card =
            document.createElement("div");

        card.className =
            "history-card";


        let workersHTML = "";


        workers.forEach(worker => {

            const status =
                dayData[worker.id];


            if(status === "present"){

                workersHTML += `
                    <div class="history-worker">
                        👷 ${worker.name}
                        — ✅ Present
                    </div>
                `;

            }
            else if(status === "absent"){

                workersHTML += `
                    <div class="history-worker">
                        👷 ${worker.name}
                        — ❌ Absent
                    </div>
                `;

            }

        });


        if(workersHTML === ""){

            workersHTML = `
                <div class="no-history">
                    कोई attendance marked नहीं है।
                </div>
            `;

        }


        card.innerHTML = `

            <div class="history-date">
                📅 ${formatHistoryDate(dateKey)}
            </div>

            <div class="history-summary">

                <div class="history-number history-total">
                    Total<br>${total}
                </div>

                <div class="history-number history-present">
                    Present<br>${present}
                </div>

                <div class="history-number history-absent">
                    Absent<br>${absent}
                </div>

            </div>

            <div class="history-workers">
                ${workersHTML}
            </div>

        `;


        list.appendChild(card);

    });

}


/* =========================
   DARK MODE
========================= */

function toggleDarkMode(){

    document.body.classList.toggle("dark");


    const dark =
        document.body.classList.contains("dark");


    localStorage.setItem(
        "darkMode",
        dark
    );

}


/* =========================
   LOAD DARK MODE
========================= */

if(
    localStorage.getItem("darkMode")
    === "true"
){

    document.body.classList.add("dark");

}


/* =========================
   INITIAL DATA MIGRATION
========================= */

/*
   अगर पुराने version में आज की
   attendance workers में मौजूद है,
   तो उसे today's history में save करेंगे।
*/

(function migrateOldAttendance(){

    const today = getDateKey();

    let changed = false;


    if(!attendanceHistory[today]){

        attendanceHistory[today] = {};

    }


    workers.forEach(worker => {

        if(
            (
                worker.attendance === "present" ||
                worker.attendance === "absent"
            )
            &&
            !attendanceHistory[today][worker.id]
        ){

            attendanceHistory[today][worker.id] =
                worker.attendance;

            changed = true;

        }

    });


    if(changed){

        saveHistory();

    }

})();

</script>
</body>
</html>
